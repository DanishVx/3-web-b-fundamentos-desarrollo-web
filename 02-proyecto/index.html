<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tarjetas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Targets</h1>
    
    <div class="contenedor-tarjetas">
        <!-- Tarjeta 1 -->
        <div class="tarjeta">
            <img class="img" src="./assets/editar-perfil.png" alt="Foto de perfil">
            <h2>Lily-Grace Colley</h2>
            <p>Diseñadora Gráfica</p>
            <p>156 Posts</p>
            <p>1.012 Likes</p>
            <p>Madrid, España</p>
<img class="icono" src="./assets/facebook.png" alt="iconoFb">
             <img class="icono" src="./assets/instagram.png" alt="iconoIg">
             <img class="icono" src="./assets/social.png" alt="iconoGH">
            <div class="botones">
                <button class="btn btn-seguir">Seguir</button>
                <button class="btn btn-mensaje">Mensaje</button>
            </div>
        </div>

        <!-- Tarjeta 2 -->
        <div class="tarjeta">
            <img  class="img"  src="./assets/perfil.png" alt="Foto de perfil">
            <h2>Murray Reeve</h2>
            <p>Desarrollador Web</p>
            <p>305 Posts</p>
            <p>2.643 Likes</p>
            <p>Barcelona, España</p>
            <img class="icono" src="./assets/facebook.png" alt="iconoFb">
             <img class="icono" src="./assets/instagram.png" alt="iconoIg">
             <img class="icono" src="./assets/social.png" alt="iconoGH">
            <div class="botones">
                <button class="btn btn-seguir">Seguir</button>
                <button class="btn btn-mensaje">Mensaje</button>
            </div>
        </div>

        <!-- Tarjeta 3 -->
        <div class="tarjeta">
            <img  class="img"  src="./assets/usuario.png" alt="Foto de perfil">
            <h2>Bianca Serrano</h2>
            <p>Diseñadora Gráfica</p>
            <p>902 Posts</p>
            <p>1.300 Likes</p>
            <p>Madrid, España</p>
            <img class="icono" src="./assets/facebook.png" alt="iconoFb">
             <img class="icono" src="./assets/instagram.png" alt="iconoIg">
             <img class="icono" src="./assets/social.png" alt="iconoGH">
            <div class="botones">
                <button class="btn btn-seguir">Seguir</button>
                <button class="btn btn-mensaje">Mensaje</button>
            </div>
        </div>
    </div>
</body>
</html>
